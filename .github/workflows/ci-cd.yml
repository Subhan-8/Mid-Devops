name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: pip

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Wait for MySQL to be Ready
      run: |
        echo "⏳ Waiting for MySQL..."
        for i in {1..15}; do
          if mysqladmin ping -h "127.0.0.1" -uroot -p"${{ secrets.MYSQL_PASSWORD }}" --silent; then
            echo "✅ MySQL is ready!"
            exit 0
          fi
          sleep 3
        done
        echo "❌ MySQL did not become ready in time"
        exit 1

    - name: Security Scan (Safety)
      run: safety check || true

    - name: Lint Code (flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Security Scan (Bandit)
      run: bandit -r . -c .bandit.yml || true

    - name: Run Tests
      env:
        DB_HOST: 127.0.0.1
        DB_USERNAME: root
        DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        DB_NAME: ${{ secrets.MYSQL_DATABASE }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
      run: |
        export PYTHONPATH="${PYTHONPATH}:$(pwd)"
        pytest -v


  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/ssis-web:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/ssis-web:${{ github.sha }}

  terraform:
    name: "Provision Infrastructure"
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Init
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: cd infra && terraform init

    - name: Terraform Apply
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: cd infra && terraform apply -auto-approve

  deploy-and-smoke:
    name: "Deploy & Smoke Test"
    needs: terraform
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Ensure git is installed
          command -v git >/dev/null 2>&1 || sudo apt-get install -y git
          
          # Clone or Pull the latest code to the server
          if [ -d 'Web-based-SSIS-main' ]; then
            cd Web-based-SSIS-main && git pull
          else
            git clone https://github.com/${{ github.repository }} Web-based-SSIS-main
            cd Web-based-SSIS-main
          fi
          
          # Deploy to K3s
          kubectl apply -f k8s/namespace.yaml
          sleep 5
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/
          # Force restart to pick up new image
          kubectl rollout restart deployment/ssis-web -n dev || true
          
    - name: Smoke Test
      run: |
        echo 'Waiting for LoadBalancer/Service...'
        sleep 45
        # Verify the app responds (using the Secret IP)
        curl -I http://${{ secrets.EC2_HOST }}:30080 || echo 'Warning: App response check failed, manual verification needed'