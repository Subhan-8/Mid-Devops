version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USERNAME=ssis_user
      - DB_PASSWORD=ssis_password
      - DB_NAME=ssisdb
    depends_on:
      - db
    networks:
      - ssis_network
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=ssisdb
      - MYSQL_USER=ssis_user
      - MYSQL_PASSWORD=ssis_password
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_script:/docker-entrypoint-initdb.d
    networks:
      - ssis_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  ssis_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local