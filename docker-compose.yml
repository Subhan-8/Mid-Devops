version: '3.8'

services:
  web:
    container_name: ssis_web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - DB_HOST=ssis_db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=ssisdb
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://ssis_redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ssis_network
    restart: unless-stopped

  db:
    container_name: ssis_db
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=ssisdb
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_HOST=%
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_script:/docker-entrypoint-initdb.d
    networks:
      - ssis_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    container_name: ssis_redis
    image: redis:alpine
    networks:
      - ssis_network
    restart: unless-stopped

networks:
  ssis_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
